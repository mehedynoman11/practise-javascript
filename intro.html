<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>JavaScript Image Changing Onclick Event.</h1>
    <br>
    <button style="width: 100%"; onclick="document.getElementById('change').src='giphy1.gif'"> Change Image </button>
    <img id="change" src="giphy1.gif" alt="giphy">
    <button style="width: 100%;" onclick="document.getElementById('change').src='giphy.gif'"> Other Image </button>


</body>
</html>
